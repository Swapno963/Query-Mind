services:
  api:
    image: ${ECR_REGISTRY}:${BACKEND_IMAGE_TAG}
    container_name: chat-llm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/db.sqlite3
    volumes:
      - sqlite_data:/app/data
    # Works with the current image (no entrypoint) and is ignored as extra
    # args once the image uses docker-entrypoint.sh.
    command:
      [
        "sh",
        "-c",
        "python manage.py migrate --noinput && gunicorn DjangoForAI.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --graceful-timeout 30",
      ]

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - public_web

volumes:
  sqlite_data:

networks:
  public_web:
    external: true
