name: Deploy

on:
  workflow_dispatch:
    inputs:
      backend_image_tag:
        description: "Backend Docker image tag"
        required: true
        default: latest
        type: string

      frontend_image_tag:
        description: "Frontend Docker image tag"
        required: true
        default: latest
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - run: |
          echo "PORT=${{ secrets.PORT != '' }}"
          echo "POSTGRES_DB=${{ secrets.POSTGRES_DB != '' }}"
          echo "JWT_SECRET=${{ secrets.JWT_SECRET != '' }}"
          echo "ACCESS_KEY=${{ secrets.ACCESS_KEY != '' }}"
  deploy:
    runs-on: ubuntu-latest

    steps:
      ########################################################
      # Checkout
      ########################################################
      - name: Checkout
        uses: actions/checkout@v4

      ########################################################
      # Ensure application directory exists
      ########################################################
      - name: Create application directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

          script: |
            sudo mkdir -p /opt/app
            sudo chown ubuntu:ubuntu /opt/app




      - name: Prepare application directory
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

          script: |
            set -Eeuo pipefail

            # Create the application directory.
            sudo mkdir -p /opt/app
            
            # Remove old deployment directories to avoid stale files.
            rm -rf /opt/app/migrations
            rm -rf /opt/app/seeds
            rm -rf /opt/app/backup

            # Docker may have created migrations as root previously.
            sudo mkdir -p /opt/app/migrations
            sudo mkdir -p /opt/app/seeds
            sudo mkdir -p /opt/app/backup

            # Allow the ubuntu SSH user to overwrite deployment files.
            sudo chown -R ubuntu:ubuntu /opt/app

            # Ensure directory traversal and file-writing permissions.
            sudo chmod -R u+rwX /opt/app

            echo "=== Current directory ownership ==="
            ls -ld /opt/app
            ls -ld /opt/app/migrations
            ls -ld /opt/app/seeds
            ls -ld /opt/app/backup
            
      ########################################################
      # Upload deployment files
      ########################################################
      - name: Upload deployment files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

          source: "docker-compose.deployment.yml,nginx.conf,migrations,seeds,backup"

          target: /opt/app



     ########################################################
      # Deploy
      ########################################################
      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.0
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

          BACKEND_IMAGE_TAG: ${{ inputs.backend_image_tag }}
          FRONTEND_IMAGE_TAG: ${{ inputs.frontend_image_tag }}

          PORT: ${{ secrets.PORT }}

          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}

          JWT_SECRET: ${{ secrets.JWT_SECRET }}

          ACCESS_KEY: ${{ secrets.ACCESS_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

          # Convert the GitHub secret names into clearer
          # application environment variable names.
          END_POINT: ${{ secrets.END_POINT }}
          USE_SSL: ${{ secrets.USE_SSL }}
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}

          # frontend
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          ALLOWED_ORIGINS : ${{secrets.ALLOWED_ORIGINS}}
          # backend
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_HOST: ${{ secrets.REDIS_HOST }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          SMS_CONFIG_ENCRYPTION_KEY: ${{secrets.SMS_CONFIG_ENCRYPTION_KEY}}
          

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}

          envs: >-
            AWS_REGION,
            ECR_REGISTRY,
            BACKEND_IMAGE_TAG,
            FRONTEND_IMAGE_TAG,
            PORT,
            POSTGRES_DB,
            POSTGRES_USER,
            POSTGRES_PASSWORD,
            JWT_SECRET,
            ACCESS_KEY,
            SECRET_KEY,
            END_POINT,
            USE_SSL,
            BUCKET_NAME,
            NEXT_PUBLIC_API_URL,
            DATABASE_URL,
            ALLOWED_ORIGINS,
            REDIS_HOST,
            REDIS_PASSWORD,
            JWT_REFRESH_SECRET,
            SMS_CONFIG_ENCRYPTION_KEY

          script: |
            set -Eeuo pipefail

            ####################################################
            # Go to application directory
            ####################################################
            cd /opt/app

            ####################################################
            # Verify uploaded deployment files
            ####################################################
            echo "=== Deployment files ==="
            ls -lah
            echo "========================"

            ####################################################
            # Verify required remote variables
            ####################################################
            required_variables=(
              AWS_REGION
              ECR_REGISTRY
              BACKEND_IMAGE_TAG
              FRONTEND_IMAGE_TAG
              PORT
              POSTGRES_DB
              POSTGRES_USER
              POSTGRES_PASSWORD
              JWT_SECRET
              ACCESS_KEY
              SECRET_KEY
              END_POINT
              USE_SSL
              BUCKET_NAME
              NEXT_PUBLIC_API_URL
              DATABASE_URL
              ALLOWED_ORIGINS
              REDIS_HOST
              REDIS_PASSWORD
              JWT_REFRESH_SECRET
              SMS_CONFIG_ENCRYPTION_KEY
            )

            missing_variables=()

            for variable_name in "${required_variables[@]}"; do
              if [[ -z "${!variable_name:-}" ]]; then
                missing_variables+=("$variable_name")
              fi
            done

            if (( ${#missing_variables[@]} > 0 )); then
              echo "Missing remote environment variables:"

              for variable_name in "${missing_variables[@]}"; do
                echo "  - $variable_name"
              done

              exit 1
            fi

            # Show only safe, non-sensitive values.
            echo "=== Remote deployment configuration ==="
            echo "AWS_REGION=$AWS_REGION"
            echo "ECR_REGISTRY=$ECR_REGISTRY"
            echo "BACKEND_IMAGE_TAG=$BACKEND_IMAGE_TAG"
            echo "FRONTEND_IMAGE_TAG=$FRONTEND_IMAGE_TAG"
            echo "PORT=$PORT"
            echo "POSTGRES_DB is configured"
            echo "POSTGRES_USER is configured"
            echo "POSTGRES_PASSWORD is configured"
            echo "JWT_SECRET is configured"
            echo "AWS credentials are configured"
            echo "======================================="

            ####################################################
            # Generate application .env file
            ####################################################
            cat > .env <<EOF
            APP_ENV=production
            PORT=${PORT}

            DB_NAME=${POSTGRES_DB}
            DB_USER=${POSTGRES_USER}
            DB_PASSWORD=${POSTGRES_PASSWORD}

            POSTGRES_DB=${POSTGRES_DB}
            POSTGRES_USER=${POSTGRES_USER}
            POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

            JWT_SECRET=${JWT_SECRET}

            ACCESS_KEY=${ACCESS_KEY}
            SECRET_KEY=${SECRET_KEY}
            END_POINT=${END_POINT}
            USE_SSL=${USE_SSL}
            BUCKET_NAME=${BUCKET_NAME}

            AWS_REGION=${AWS_REGION}
            ECR_REGISTRY=${ECR_REGISTRY}
            BACKEND_IMAGE_TAG=${BACKEND_IMAGE_TAG}
            FRONTEND_IMAGE_TAG=${FRONTEND_IMAGE_TAG}
            NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
            DATABASE_URL=${DATABASE_URL}

            
            DATABASE_URL=${DATABASE_URL}
            ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
            REDIS_HOST=${REDIS_HOST}
            REDIS_PASSWORD=${REDIS_PASSWORD}
            JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
            SMS_CONFIG_ENCRYPTION_KEY=${SMS_CONFIG_ENCRYPTION_KEY}
            EOF

            # Prevent other Linux users from reading secrets.
            chmod 600 .env




            ####################################################
            # Verify ECR credential helper
            ####################################################
            docker-credential-ecr-login version

            # Confirm AWS authentication works.
            # aws sts get-caller-identity

            # Authenticate Docker with the private ECR registry.
            # aws ecr get-login-password \
            #   --region "$AWS_REGION" |
            #   docker login \
            #     --username AWS \
            #     --password-stdin "$ECR_REGISTRY"

            ####################################################
            # Verify ECR credential helper
            ####################################################

            # Confirm the helper is installed.
            docker-credential-ecr-login version

            # Confirm Docker has the ECR helper configuration.
            if [[ ! -f "$HOME/.docker/config.json" ]]; then
              echo "Missing Docker configuration: $HOME/.docker/config.json"
              exit 1
            fi

            echo "=== Docker credential configuration ==="
            cat "$HOME/.docker/config.json"
            echo "======================================="

            ####################################################
            # Validate Docker Compose configuration
            ####################################################
            docker compose \
              --env-file .env \
              -f docker-compose.deployment.yml \
              config --quiet

            ####################################################
            # Pull Docker images
            ####################################################
            docker compose \
              --env-file .env \
              -f docker-compose.deployment.yml \
              pull

            ####################################################
            # First runs migrate
            ####################################################
            if ! docker compose --env-file .env -f docker-compose.deployment.yml run migrate; then
              echo "Migration failed; aborting deploy."
              exit 1
            fi

            
            ####################################################
            # Start backup containers
            ####################################################
            docker compose \
              --env-file .env \
              -f docker-compose.deployment.yml \
              up -d --build backup

            ####################################################
            # Start Other containers
            ####################################################
            if ! docker compose \
              --env-file .env \
              -f docker-compose.deployment.yml \
              up -d api frontend worker_1 worker_2


            then
              echo "Deployment failed."

              echo "=== Container status ==="
              docker compose \
                --env-file .env \
                -f docker-compose.deployment.yml \
                ps || true

              echo "=== Recent container logs ==="
              docker compose \
                --env-file .env \
                -f docker-compose.deployment.yml \
                logs --tail=100 || true

              exit 1
            fi

            ####################################################
            # Remove unused Docker images
            ####################################################
            docker image prune -af

            ####################################################
            # Deployment status
            ####################################################
            echo "=== Running Docker containers ==="
            docker ps

            echo "=== Docker Compose services ==="
            docker compose \
              --env-file .env \
              -f docker-compose.deployment.yml \
              ps



            echo "Waiting for API to become healthy..."

            until [ "$(docker inspect -f '{{.State.Health.Status}}' education-api)" = "healthy" ]; do
                sleep 2
            done


            echo "Deployment completed successfully."
