name: Security Scan

on:
  push:
  pull_request:
    branches:
      - main

jobs:
  security:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write

    steps:
      # ==========================================
      # Checkout
      # ==========================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==========================================
      # Setup Python
      # ==========================================

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ==========================================
      # Install uv
      # ==========================================

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      # ==========================================
      # Install Dependencies
      # ==========================================

      - name: Install Dependencies
        run: uv sync --frozen

      # ==========================================
      # Python Dependency Vulnerability Scan
      # ==========================================

      - name: Run pip-audit
        run: |
          uv run pip-audit

      # ==========================================
      # Secret Detection
      # ==========================================

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2

      # ==========================================
      # Filesystem Vulnerability Scan
      # ==========================================

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
          ignore-unfixed: true