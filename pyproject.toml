[project]
name = "djangoforai"
version = "0.1.0"
description = "Django AI Chat with Ollama and HTMX"
dependencies = [
    "django>=5.0",
    "djangorestframework>=3.18.0",
    "google-genai>=2.19.0",
    "gunicorn>=26.1.0",
    "httpx>=0.25.0",
    "markdown>=3.5",
    "mcp[cli]>=2.0.0",
    "sqlglot>=30.17.0",
    "psycopg[binary]>=3.3.4",
    "python-decouple>=3.8",
]
requires-python = ">=3.10"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false
