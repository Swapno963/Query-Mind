services:
  api:
    image: ${ECR_REGISTRY}:${BACKEND_IMAGE_TAG}
    container_name: chat-llm
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SQLITE_PATH: /app/data/db.sqlite3
      APP_MODE: ${APP_MODE:-both}
    volumes:
      - sqlite_data:/app/data
    command:
      [
        "sh",
        "-c",
        "python manage.py migrate --noinput && gunicorn DjangoForAI.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --graceful-timeout 30",
      ]
    expose:
      - "8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 40s
    networks:
      - querymind_net

  nginx:
    image: nginx:1.27-alpine
    container_name: querymind-nginx
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - querymind_net

volumes:
  sqlite_data:

networks:
  querymind_net:
    name: querymind_net
    driver: bridge
