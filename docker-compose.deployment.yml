services:
  api:
    image: ${ECR_REGISTRY}:${BACKEND_IMAGE_TAG}
    container_name: chat-llm
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

    env_file:
      - .env
    # volumes:
    #   - sqlite_data:/app/db.sqlite3

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    # expose:
    #   - "8080"

    networks:
      - app_network

  migrate:
    image: ${ECR_REGISTRY}:${BACKEND_IMAGE_TAG}
    command: python manage.py migrate
    env_file:
      - .env
    # volumes:
    #   - sqlite_data:/app/db.sqlite3

  nginx:
    image: nginx:1.29-alpine
    container_name: nginx

    restart: unless-stopped

    depends_on:
      - api

    ports:
      - "80:80"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

    networks:
      - app_network




# volumes:
#   sqlite_data:


networks:
  app_network:
    driver: bridge
